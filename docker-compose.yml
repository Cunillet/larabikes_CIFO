services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larabikes
    ports:
      - "8080:80"
      - "9003:9003"
    volumes:
      - ./laravel-app:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=larabikes_db
      - DB_USERNAME=larabikes_admin
      - DB_PASSWORD=rootpassword
    depends_on:
      - db
      - mailpit
    networks:
      - laravel-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: larabikes_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: larabikes_db
      MYSQL_USER: larabikes_admin
      MYSQL_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: larabikes_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    depends_on:
      - db
    networks:
      - laravel-network

  # Mailpit - Servidor de correo para desarrollo
  mailpit:
    image: axllent/mailpit:latest
    container_name: larabikes_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Interfaz web de Mailpit
      - "1025:1025"   # Puerto SMTP
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_DATABASE: /data/mailpit.db
      # Nota: La contraseña debe estar en texto plano o MD5
      # MP_SMTP_USERS: "admin:password123,user:pass456"
    volumes:
      - mailpit_data:/data  # Persistencia opcional
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db_data:
  mailpit_data:  # Volumen para Mailpit