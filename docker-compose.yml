services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larabikes
    ports:
      - "8080:80"
      - "9003:9003"
    volumes:
      - ./laravel-app:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=larabikes_db
      - DB_USERNAME=larabikes_admin
      - DB_PASSWORD=rootpassword
    depends_on:
      - db
    networks:
      - laravel-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: larabikes_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: larabikes_db
      MYSQL_USER: larabikes_admin
      MYSQL_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: larabikes_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    depends_on:
      - db
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db_data: